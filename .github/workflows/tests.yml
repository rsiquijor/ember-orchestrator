name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The core is stdlib-only; these two are the optional Excel/Word
      # exporters, which the export tests exercise.
      - name: Install optional exporter libraries
        run: python -m pip install openpyxl==3.1.5 python-docx==1.2.0
      - name: Run the test suite (offline, $0)
        env:
          MCP_DISCOVERY_TTL_S: "0"
        run: python -m unittest discover -s tests
